name: quality

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Pin the contract runtime used by the semantic linter
        run: echo "GENVM_VERSION=v0.2.12" >> "$GITHUB_ENV"
      - run: genvm-lint check contracts/crux_registry.py --json
      - run: genvm-lint check contracts/evidence_verifier.py --json
      - run: genvm-lint check contracts/closure_judge.py --json
      - run: pytest tests/direct/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
